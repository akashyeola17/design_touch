<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta
      name="description"
      content="Browse Design Touch exhibition stall design and fabrication projects, plus interior work, from trade shows and expos across Mumbai and India."
    />
    <link rel="canonical" href="https://designtouchmumbai.com/projects" />
    <link rel="icon" href="/assets/images/logo/modern-designntouch.png" type="image/png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Design Touch" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Exhibition Stall Design Projects | Design Touch Portfolio" />
    <meta
      property="og:description"
      content="Selected exhibition stall, expo booth, and interior projects designed and fabricated by Design Touch."
    />
    <meta property="og:url" content="https://designtouchmumbai.com/projects" />
    <meta property="og:image" content="https://designtouchmumbai.com/assets/images/hero/hero1.jpeg" />
    <meta property="og:image:alt" content="Exhibition stall project by Design Touch" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Exhibition Stall Design Projects | Design Touch Portfolio" />
    <meta
      name="twitter:description"
      content="Selected exhibition stall, expo booth, and interior projects designed and fabricated by Design Touch."
    />
    <meta name="twitter:image" content="https://designtouchmumbai.com/assets/images/hero/hero1.jpeg" />
    <title>Exhibition Stall Design Projects | Design Touch Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/animations.css" />
    <link rel="stylesheet" href="/css/portfolio.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://designtouchmumbai.com/" },
          { "@type": "ListItem", "position": 2, "name": "Projects", "item": "https://designtouchmumbai.com/projects" }
        ]
      }
    </script>
    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/projects-page.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="site-header"></div>
    <main id="main-content">
      <section class="portfolio-hero">
        <div class="portfolio-hero__texture" aria-hidden="true"></div>
        <div class="container portfolio-hero__content">
          <p class="eyebrow">DESIGN TOUCH / SELECTED WORK</p>
          <h1>OUR<br /><em>WORK</em></h1>
          <p>Exhibition stall design, fabrication, and interior projects across India</p>
          <a class="portfolio-hero__scroll" href="#portfolio">EXPLORE THE PORTFOLIO <span aria-hidden="true">↓</span></a>
        </div>
        <span class="portfolio-hero__index" aria-hidden="true">01 — 62</span>
      </section>
      <section class="portfolio-work section-pad" id="portfolio" aria-labelledby="portfolio-title">
        <div class="container">
          <div class="portfolio-work__heading">
            <div>
              <p class="eyebrow">OUR PORTFOLIO</p>
              <h2 id="portfolio-title">Design made <em>real.</em></h2>
            </div>
            <p class="portfolio-count" data-project-count aria-live="polite"></p>
          </div>
          <div class="portfolio-filters" role="group" aria-label="Filter projects by category">
            <button type="button" class="is-active" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="exhibition" aria-pressed="false">Exhibition</button>
            <button type="button" data-filter="interior" aria-pressed="false">Interior</button>
          </div>
          <div class="portfolio-grid" data-portfolio-grid aria-live="polite"></div>
        </div>
      </section>
      <section class="page-cta portfolio-cta">
        <div class="container page-cta__inner">
          <p class="eyebrow">HAVE A PROJECT IN MIND?</p>
          <h2>Let's make<br /><em>something matter.</em></h2>
          <a class="button button--outline-light" href="mailto:govind.designtouch@gmail.com" data-whatsapp-action>Start a conversation <span aria-hidden="true">↗</span></a>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <div id="whatsapp-contact"></div>
  </body>
</html>
